name: Bench

on:
  pull_request:

permissions:
  pull-requests: write

jobs:
  bench:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        proxy: [nginx, caddy, traefik, haproxy]
    steps:
      - uses: actions/checkout@v4

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring \
            --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 \
            --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Build backend
        run: docker build -t backend ./backend

      - name: Bench ${{ matrix.proxy }}
        run: |
          docker compose -f ${{ matrix.proxy }}/docker-compose.yml up -d
          timeout 30 bash -c 'until curl -sf http://localhost:8080/ping > /dev/null; do sleep 1; done'
          k6 run -e PROXY=${{ matrix.proxy }} -e TARGET_URL=http://localhost:8080 bench/load.js
          docker compose -f ${{ matrix.proxy }}/docker-compose.yml down -v

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.proxy }}
          path: /tmp/bench-${{ matrix.proxy }}.json

  summarize:
    needs: bench
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download results
        uses: actions/download-artifact@v4
        with:
          pattern: bench-*
          merge-multiple: true
          path: /tmp

      - name: Generate summary
        run: bash scripts/summarize.sh > bench-summary.md

      - name: Upload summary
        uses: actions/upload-artifact@v4
        with:
          name: bench-summary
          path: bench-summary.md

      - name: Post PR comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: bench
          path: bench-summary.md
