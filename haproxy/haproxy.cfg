global
    maxconn 4096

defaults
    mode http
    timeout connect 5s
    timeout client  30s
    timeout server  30s
    option forwardfor

frontend http
    bind *:80
    default_backend api_servers

backend api_servers
    balance roundrobin
    option httpchk
    http-check send meth GET uri /ping
    http-check expect status 200
    default-server inter 2s fall 3 rise 2 maxconn 100
    server app1 backend:8080 check
